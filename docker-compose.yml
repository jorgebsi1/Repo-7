# Opcional: Postgres real. Para desarrollo basta `pnpm dev` (usa PGlite, sin Docker).
# Redis se añadirá cuando haya colas o caché que lo justifiquen (hoy el código no lo usa).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prolac
      POSTGRES_PASSWORD: prolac
      POSTGRES_DB: prolac
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
